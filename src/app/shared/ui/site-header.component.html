<div class="bg-[#2d2926] px-5 py-2.5 text-center text-[10px] font-medium uppercase tracking-[0.24em] text-[#f6f0e6] sm:text-[11px]">
  Envío gratuito en pedidos superiores a 90 €
</div>
<header class="relative z-30 border-b border-black/10 bg-[#f7f4ee]">
  <div class="mx-auto flex h-[76px] max-w-[1380px] items-center justify-between px-5 sm:h-[88px] sm:px-8 lg:px-12">
    <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'" [attr.aria-expanded]="menuOpen">
      <span></span><span></span><span></span>
    </button>
    <a class="font-display whitespace-nowrap text-[27px] leading-none tracking-[-0.04em] sm:text-[32px]" routerLink="/">
      MASPELO <span class="italic text-[#9a7452]">365</span>
    </a>
    <nav class="hidden items-center gap-8 text-xs font-semibold uppercase tracking-[0.15em] lg:flex" aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" class="relative py-3 transition-colors hover:text-[#9a7452]" [class.catalog-nav-active]="activeSection === item.label" [attr.aria-current]="activeSection === item.label ? 'page' : null">
          {{ item.label }}
          @if (activeSection === item.label) { <span class="absolute inset-x-0 bottom-0 h-px bg-[#9a7452]"></span> }
        </a>
      }
    </nav>
    <div class="flex items-center gap-1 sm:gap-3">
      <button class="icon-button hidden sm:flex" type="button" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
      <button class="icon-button hidden sm:flex" type="button" aria-label="Mi cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"/></svg></button>
      <button class="icon-button relative" type="button" aria-label="Cesta"><svg viewBox="0 0 24 24"><path d="M5.5 8.5h13l-1 12h-11l-1-12Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg><span class="absolute right-0 top-0 flex h-4 w-4 items-center justify-center rounded-full bg-[#9a7452] text-[8px] text-white">2</span></button>
    </div>
  </div>
  @if (menuOpen) {
    <nav class="absolute inset-x-0 top-full border-y border-black/10 bg-[#f7f4ee] px-6 py-5 shadow-xl lg:hidden" aria-label="Navegación móvil">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" (click)="menuOpen = false" class="block w-full border-b border-black/10 py-3 text-sm uppercase tracking-[0.18em] last:border-0" [class.catalog-nav-active]="activeSection === item.label" [attr.aria-current]="activeSection === item.label ? 'page' : null">{{ item.label }}</a>
      }
    </nav>
  }
</header>
